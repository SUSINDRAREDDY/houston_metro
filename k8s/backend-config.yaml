apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: metroai-backend
  namespace: metroai
spec:
  healthCheck:
    type: HTTP
    requestPath: /api/health/ready
    port: 8000
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
  connectionDraining:
    drainingTimeoutSec: 30
  timeoutSec: 60
  logging:
    enable: true
    sampleRate: 1.0
