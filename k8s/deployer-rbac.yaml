apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metroai-deployer
  namespace: metroai
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["metroai"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metroai-deployer
  namespace: metroai
subjects:
- kind: User
  name: metroai-m6-deploy@metroai-vm-milestone-20260922.iam.gserviceaccount.com
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: metroai-deployer
  apiGroup: rbac.authorization.k8s.io
