apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  name: metroai
  namespace: metroai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metroai
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: metroai
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/metroai-vm-milestone-20260922/metroai/metroai@sha256:a2e225f4b7c6377ad4d6b5be53eb69b410f1754937f922b2c64ace5450d0608b
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '1'
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 1Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /api/health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
        envFrom:
        - configMapRef:
            name: metroai-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(60)
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: metroai-app
      terminationGracePeriodSeconds: 120
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: metroai
