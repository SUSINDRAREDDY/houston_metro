name: Deploy MetroAI

on:
  push:
    branches: [codex/milestone6-observability]

permissions:
  contents: read
  id-token: write

concurrency:
  group: metroai-gke-deploy
  cancel-in-progress: false

env:
  IMAGE: us-central1-docker.pkg.dev/metroai-vm-milestone-20260922/metroai/metroai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1065898950357/locations/global/workloadIdentityPools/metroai-github/providers/github
          service_account: metroai-m6-deploy@metroai-vm-milestone-20260922.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Configure Artifact Registry credentials
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: metroai-gke
          location: us-central1
          project_id: metroai-vm-milestone-20260922
      - name: Deploy, verify HTTPS, and roll back on failure
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/milestone6/deploy.sh "$IMAGE@$IMAGE_DIGEST" "$GITHUB_SHA"
